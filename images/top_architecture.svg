<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <style>
      .box { fill: #f0f4f8; stroke: #2c5282; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-title { fill: #2c5282; font-weight: bold; }
      .box-text { fill: #333; }
      .line { stroke: #666; stroke-width: 1.5; fill: none; }
      .label { fill: #555; font-size: 11px; }
      .bus-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 4; ry: 4; }
      .bus-text { fill: #2e7d32; font-weight: bold; }
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a365d">sys_pcie_eth_pwr_wrap 顶层架构</text>

  <!-- SMMU -->
  <rect x="200" y="50" width="200" height="46" class="box"/>
  <text x="300" y="72" text-anchor="middle" class="box-title">SMMU</text>
  <text x="300" y="86" text-anchor="middle" class="box-text" font-size="11">DMA 地址转换</text>

  <!-- Arrow: SMMU → PCIe -->
  <line x1="300" y1="96" x2="300" y2="120" class="line" marker-end="url(#arrow)"/>

  <!-- hsio_bus label (side) -->
  <text x="420" y="100" class="label" fill="#2e7d32">← hsio_bus</text>

  <!-- PCIe Controller x5 -->
  <rect x="100" y="120" width="400" height="46" class="box"/>
  <text x="300" y="142" text-anchor="middle" class="box-title">PCIe Controller ×5</text>
  <text x="300" y="156" text-anchor="middle" class="box-text" font-size="11">X4 / X2 / X2 / X1 / X1</text>

  <!-- Arrow: PCIe → PHYs -->
  <line x1="200" y1="166" x2="200" y2="200" class="line" marker-end="url(#arrow)"/>
  <line x1="400" y1="166" x2="400" y2="200" class="line" marker-end="url(#arrow)"/>

  <!-- Bifurcation Fabric label -->
  <text x="300" y="188" text-anchor="middle" class="label">bifurcation 交换网络</text>

  <!-- sys_hsio_pcie (PHY0) -->
  <rect x="100" y="205" width="200" height="60" class="box"/>
  <text x="200" y="228" text-anchor="middle" class="box-title">sys_hsio_pcie</text>
  <text x="200" y="242" text-anchor="middle" class="box-text" font-size="11">PHY0 · X4 32G-PHY</text>
  <text x="200" y="256" text-anchor="middle" class="box-text" font-size="11">X4 + X2 + X1 PCIe</text>

  <!-- sys_hsio_hybrid (PHY1) -->
  <rect x="300" y="205" width="200" height="60" class="box"/>
  <text x="400" y="228" text-anchor="middle" class="box-title">sys_hsio_hybrid</text>
  <text x="400" y="242" text-anchor="middle" class="box-text" font-size="11">PHY1 · X4 32G-PHY</text>
  <text x="400" y="256" text-anchor="middle" class="box-text" font-size="11">X1 PCIe + ETH ×3</text>

  <!-- Arrow down from PHYs to lanes -->
  <line x1="140" y1="265" x2="140" y2="300" class="line"/>
  <line x1="200" y1="265" x2="200" y2="300" class="line"/>
  <line x1="260" y1="265" x2="260" y2="300" class="line"/>
  <line x1="340" y1="265" x2="340" y2="300" class="line"/>
  <line x1="400" y1="265" x2="400" y2="300" class="line"/>
  <line x1="460" y1="265" x2="460" y2="300" class="line"/>

  <!-- Lane labels -->
  <text x="140" y="315" text-anchor="middle" class="label">Lane0</text>
  <text x="200" y="315" text-anchor="middle" class="label">Lane1</text>
  <text x="260" y="315" text-anchor="middle" class="label">Lane2</text>
  <text x="340" y="315" text-anchor="middle" class="label">Lane0</text>
  <text x="400" y="315" text-anchor="middle" class="label">Lane1</text>
  <text x="460" y="315" text-anchor="middle" class="label">Lane2/3</text>

  <!-- External link arrows -->
  <line x1="140" y1="320" x2="140" y2="350" class="line" marker-end="url(#arrow)"/>
  <line x1="200" y1="320" x2="200" y2="350" class="line" marker-end="url(#arrow)"/>
  <line x1="260" y1="320" x2="260" y2="350" class="line" marker-end="url(#arrow)"/>
  <line x1="340" y1="320" x2="340" y2="350" class="line" marker-end="url(#arrow)"/>
  <line x1="400" y1="320" x2="400" y2="350" class="line" marker-end="url(#arrow)"/>
  <line x1="460" y1="320" x2="460" y2="350" class="line" marker-end="url(#arrow)"/>

  <!-- External label -->
  <text x="300" y="370" text-anchor="middle" class="label">外部链路</text>

  <!-- NOC bus section -->
  <rect x="420" y="50" width="150" height="46" class="bus-box"/>
  <text x="495" y="72" text-anchor="middle" class="bus-text">hsio_bus</text>
  <text x="495" y="86" text-anchor="middle" class="box-text" font-size="10">snoc2hsio + hsio2ring</text>

  <rect x="420" y="110" width="150" height="40" class="bus-box"/>
  <text x="495" y="132" text-anchor="middle" class="bus-text">hsio_sub_bus</text>
  <text x="495" y="146" text-anchor="middle" class="box-text" font-size="10">hsio2mnoc + hsio2snoc</text>

  <line x1="420" y1="73" x2="400" y2="73" class="line" stroke-dasharray="4,3"/>
  <line x1="420" y1="130" x2="400" y2="130" class="line" stroke-dasharray="4,3"/>
</svg>